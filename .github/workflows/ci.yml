# Hosted CPU checks. Imaging (OptiX/CUDA), Gazebo and RViz need a GPU host: the full
# suite stays a local gate (python3 tools/run_tests.py), see docs/DEVELOPMENT_RULES.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU build and tests (SSB_IMAGING=OFF, no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lint compares changed lines with the push/PR base

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install declared dependencies
        run: |
          rosdep update
          rosdep install --from-paths src/ssb_core src/ssb_tools --ignore-src -y --rosdistro jazzy

      - name: Build CPU-only packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select ssb_core ssb_tools --symlink-install \
            --cmake-args -DSSB_IMAGING=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Tests (cpu-ci profile; CUDA tests are listed as deselected)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tools/run_tests.py --profile cpu-ci --output ci_test_logs

      - name: Lint (pyflakes everywhere; style on changed lines only)
        shell: bash
        run: |
          python3 -m venv /tmp/lint
          /tmp/lint/bin/pip install --quiet 'ruff==0.6.9' 'clang-format==18.1.8'
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          PATH=/tmp/lint/bin:$PATH python3 tools/lint_changed.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ci_test_logs
          if-no-files-found: ignore
