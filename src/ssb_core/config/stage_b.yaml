# Stage B geometry/timing baseline. Use stage_b_optics to bind the prepared
# textured/illuminated OptiX scene; see docs/STAGE_B.md.
schema: ssb.config.v1
tunnel:
  radius_m: 2.75
  axis_z_m: 2.015            # rail top z=0; tunnel bottom z=-0.735
  x_min_m: -1.5
  x_max_m: 21.5
scan_encoder: {ppr: 2500, edges_per_cycle: 4}
rescaler: {multiply: 128, divide: 15, max_period_s: 0.01}
camera:
  width: 4096
  pixel_pitch_m: 7.04e-6
  fov_at_nominal_m: 0.8522592711111112
  nominal_distance_m: 2.75
  # 90 mm lens focused at 2.75 m: thin-lens image distance 93.045112782 mm.
  # Config::FocalLength() is the effective ray-projection distance, not the lens f.
  exposure_s: 8.0e-6
  trigger_delay_s: 0.0
  max_line_rate_hz: 50000
gate: {start_deg: -120.0, end_deg: 120.0}
odometer: {ppr: 2500, edges_per_cycle: 4, gear_ratio: 1.0}
motion:
  line_rate_hz: 28444.444444444445 # 0.2 m/s, 20 rpm; spatial pitches unchanged
  advance_per_rev_m: 0.6
  start_theta_deg: 180.0
  start_x_m: -0.9
  sample_period_s: 0.001
  # 21.8 m centre travel, including start/end coverage buffers.
  profile:
    - [0.0, 0.0]
    - [1.0, 1.0]
    - [109.0, 1.0]
    - [110.0, 0.0]
    - [110.3, 0.0]
truth:
  lens_k1: 0.006  # Assumed +0.6% pincushion at ideal half sensor width.
  wheel_diameter_m: 0.2
  scan_encoder_zero_deg: 0.0
  gate_start_offset_deg: 0.0
  gate_end_offset_deg: 0.0
  head_mount_x_m: 0.0
  mount: {e_m: 0.0, tangential_m: 0.0, dy_m: 0.0, dz_m: 0.0, tilt_y_rad: 0.0, tilt_z_rad: 0.0, twist_rad: 0.0}
calibration: {wheel_diameter_m: 0.2, radius_m: 2.75, head_mount_x_m: 0.0}
render:
  batch_rows: 1024
  debug_column_stride: 256
  max_queued_batches: 4
  debug_delay_per_batch_s: 0.0
acceptance: {valid_x_m: [0.0, 20.0]}
storage:
  block_rows: 4096
  write_queue_bytes: 134217728
