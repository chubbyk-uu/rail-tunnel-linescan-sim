# Stage A baseline (DESIGN.md §3, §4, §13 stage A). Values the design marks as
# provisional stay provisional here; the comments name their status.
schema: ssb.config.v1

robot:
  base_reference_z_m: 0.25  # matches stage_a.sdf base link
  scan_axis_height_m: 1.72  # head relative to base; optical centre remains at z=1.97

tunnel:
  radius_m: 2.77          # patent example value, used for stage 1
  axis_z_m: 1.97          # axis height above rail top; engineering assumption
  x_min_m: -2.0
  x_max_m: 8.0

scan_encoder:
  ppr: 2500               # A-phase cycles per revolution, 1:1 with the scan axis
  edges_per_cycle: 4      # A rise/fall, B rise/fall

rescaler:
  multiply: 64
  divide: 7
  max_period_s: 0.01      # an edge period longer than this gives no period estimate

camera:
  width: 4096
  pixel_pitch_m: 7.04e-6
  fov_at_nominal_m: 0.8   # longitudinal field of view at nominal_distance_m
  nominal_distance_m: 2.77
  exposure_s: 8.0e-6      # untuned starting point
  trigger_delay_s: 0.0
  max_line_rate_hz: 50000 # recalled measured limit, to be verified

gate:
  start_deg: -120.0       # exposure centre inclusive
  end_deg: 120.0          # exposure centre exclusive

odometer:
  ppr: 2500
  edges_per_cycle: 4
  gear_ratio: 1.0         # encoder revolutions per wheel revolution

motion:
  line_rate_hz: 50000
  advance_per_rev_m: 0.6
  start_theta_deg: 180.0  # start in the unscanned bottom arc
  start_x_m: 0.0
  sample_period_s: 0.001       # also the Gazebo physics step; the plugin refuses a mismatch
  # Speed-factor knots [time_s, factor]; quintic smootherstep between knots.
  profile:
    - [0.0, 0.0]
    - [1.0, 1.0]
    - [6.5, 1.0]
    - [7.5, 0.0]
    - [7.8, 0.0]

# T_true: used by imaging and written only to evaluation/. Reconstruction never reads it.
truth:
  wheel_diameter_m: 0.2
  scan_encoder_zero_deg: 0.0    # true axis angle at relative encoder count 0 is start_theta + this
  gate_start_offset_deg: 0.0
  gate_end_offset_deg: 0.0
  head_mount_x_m: 0.0           # rotation axis point relative to the car reference, along x
  mount:
    e_m: 0.0                    # optical centre offset along the optical axis
    tangential_m: 0.0           # optical centre offset along the scan direction
    dy_m: 0.0                   # rotation axis translation relative to the tunnel axis
    dz_m: 0.0
    tilt_y_rad: 0.0             # rotation-axis tilt about y
    tilt_z_rad: 0.0             # rotation-axis tilt about z
    twist_rad: 0.0              # line rotation about the optical axis

# T_hat: the only installation geometry reconstruction may use.
calibration:
  wheel_diameter_m: 0.2
  radius_m: 2.77
  head_mount_x_m: 0.0

render:
  batch_rows: 1024
  debug_column_stride: 256      # truth hit coordinates for every Nth column plus the last
  max_queued_batches: 8         # row-job batches waiting for rendering; timing waits beyond this
  debug_delay_per_batch_s: 0.0  # test hook: artificial imaging lag

# Evaluation only. Head x range whose exposures must all exist; the start and stop
# ramps outside it are buffers where dropped rows are counted and reported.
acceptance:
  valid_x_m: [0.25, 1.9]

storage:
  block_rows: 4096
  write_queue_bytes: 268435456
