# Stage B wall background material set (DESIGN.md §6, docs/history/STAGE_B_TEXTURE_AUDIT.md "选材决定").
# Sources live under a local sources root (not in git): <root>/<dir>/downloads.json + PNG channels.
schema: ssb.material_set.v1
seed: 20260930
brightness: 0.8
# Generated grid: align to a source's native pitch (exact texel copies), or give pitch_m.
# Production: 0.1 mm with 2x2 texture footprint integration in the camera (B4, GUI RTF 0.683).
# align_to concrete034 (0.067 mm) is closer to the ray-area reference (RMSE 2.1 vs 2.9 DN)
# but doubles tile generation; estimated full-chain RTF ~0.5, below the 0.6 target.
grid: {pitch_m: 0.0001}
layout:
  guide_texel_m: 0.01      # seam guide; feather ~6.5 mm
  patch_m: 0.3             # Concrete034 is only 0.55 m tall
  overlap_m: 0.08
  # Within min_repeat_m (2D wall distance): no crop centre reuse closer than near_crop_m, and
  # same-orientation crops may share at most max_same_orientation_overlap of their source area
  # (translation-matchable duplicates would mislead strip registration).
  # With 4 streak-preserving orientations, >= 0.5 m is infeasible for one 0.57 m2 source;
  # 0.45 m still exceeds the +/-0.3 m repetition search (docs/history/STAGE_B_TEXTURE_AUDIT.md).
  min_repeat_m: 0.45
  near_crop_m: 0.03
  max_same_orientation_overlap: 0.25
  candidates: 96
sources:
  - id: concrete034
    dir: concrete034
    # ambientCG Concrete034, 1.10 x 0.55 m, 16384 x 8192 (0.067 mm/texel), CC0.
    # Gain brings its linear mean albedo (0.48) to the Wall 04 baseline (0.206 incl. brightness),
    # so lamp and exposure settings stay unchanged. Not an absolute reflectance calibration.
    albedo_gain: 0.533
    weight: 1
    # Keep the horizontal trowel marks horizontal: identity, mirror, 180 deg, 180 deg + mirror.
    # Quarter turns crossed the marks into an unnatural woven pattern.
    orientations: [0, 1, 4, 5]
    # Grout-plug rings, shallow ring pits with hairline cracks, and a spalled edge.
    exclude_circles_m:
      - [0.012, 0.008, 0.040]
      - [0.365, 0.040, 0.055]
      - [0.565, 0.283, 0.050]
      - [0.525, 0.382, 0.060]
      - [1.070, 0.105, 0.060]
# Low-frequency albedo modulation (>= cutoff_m) from a real wall; arrangement and per-segment
# tone are synthetic. Fine detail still comes only from the sources above.
macro:
  dir: painted_plaster_wall   # Poly Haven, 2.0 x 2.0 m, CC0; 4K diffuse is ample for >= 20 mm
  pitch_m: 0.005
  cutoff_m: 0.02
  strength: 1.0
  segment_tone_sigma: 0.03    # per ring segment, like separate casting batches (assumption)
