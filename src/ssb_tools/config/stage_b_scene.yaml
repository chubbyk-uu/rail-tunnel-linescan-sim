schema: ssb.scene_spec.v1
seed: 20260929
panels:
  ring_width_m: 1.2
  angles_deg: [10, 67, 72, 72, 72, 67]
  alternating_stagger_deg: 18.0
  angular_step_deg: 0.5       # chord sag <=0.027 mm at R=2.75 m
  # Joint profile (all assumptions unless noted): 45 deg inner-edge chamfer, caulking groove
  # (Tianjin DB/T 29-272: depth 25-55 mm, single-side width 5-10 mm), filler recess below the
  # chamfer bottom. Outer visible opening = 2*(half width + chamfer) = 16 mm
  # (user choice 2026-10-01: 3 mm chamfer, 10 mm groove at the standard's lower bound).
  joint_chamfer_m: 0.003
  joint_groove_half_width_m: 0.005
  joint_depth_m: 0.035            # surface to groove floor
  # Rounded chamfer edges (user request 2026-10-01): 1 mm fillets, and a slight smooth wiggle
  # of the chamfer's inner edge along the joint (assumptions).
  joint_edge_radius_m: 0.001
  joint_edge_fillet_steps: 2
  joint_edge_wiggle: {rms_m: 0.00015, wavelengths_m: [0.06, 0.11, 0.23]}
  joint_along_step_m: 0.04        # longitudinal-joint subdivision along x (wiggle sampling)
  joint_contact_gap_m: 0.002      # segment contact gap in the groove floor (assumption)
  joint_gap_depth_m: 0.02         # visible gap depth before the dark gasket/void (assumption)
  joint_filler_recess_m: [0.0, 0.002]
  # Per joint section (ring joints split at the segment boundaries of the ring after them,
  # longitudinal joints per ring). User decision 2026-10-01: all joints filled with grey mortar.
  # Unfilled/damaged sections looked abrupt (state switches at section boundaries, damage only
  # a sunken filler band); the code paths remain for a future, reference-based damage model.
  joint_states: {filled: 1.0, unfilled: 0.0, damaged: 0.0}
  joint_damage: {loss_fraction: [0.3, 0.7], stretch_m: [0.05, 0.30], loss_depth_m: [0.005, 0.020]}
track:
  gauge_m: 1.435
  head_width_m: 0.073
  rail_height_m: 0.176
  foot_width_m: 0.150
  web_width_m: 0.0165
  bed_width_m: 2.3
robot:
  total_mass_kg: 120.0
  wheelbase_m: 0.7
  wheel_diameter_m: 0.2
  # Contact mode: odometry from two spring-loaded measuring wheels behind the rear axle, one per
  # rail (curves later), on vertical linear guides; running wheels carry no encoders. User chose
  # 80 mm and a vertical slide (2026-10-01); preload, rate, masses and placement are estimates.
  measuring_wheel:
    diameter_m: 0.08
    width_m: 0.03
    x_m: -0.52             # wheel centre, car frame; rear running wheel centre is at -0.35
    preload_n: 30.0        # spring force at nominal height; ~0.05 N traction needed at 0.4 m/s^2
    spring_rate_n_m: 2000. # soft: +/-5 mm of travel changes the preload by +/-10 N
    damping_n_s_m: 20.
    travel_m: 0.012        # +/- slide travel about the nominal height
    slider_mass_kg: 0.35
    wheel_mass_kg: 0.15
  guide_bearing_radius_m: 0.025 # estimated; vertical spindle, tangent to inner rail head
  guide_bearing_width_m: 0.024 # estimated axial width, contained within 38 mm head
  guide_bearing_clearance_m: 0.002 # per side; avoids wedging the rolling chassis on irregular rails
  head_cradle_length_m: 0.56 # updated machine photos; unmeasured envelope estimate
  head_floor_depth_m: 0.215 # floor centre below shaft; lowered by 10 mm
  post_top_spacing_m: 0.62   # nearly vertical, outside the U cradle
  post_diameter_m: 0.036
  brace_diameter_m: 0.024   # provisional tube size, front-left / rear-right
  camera_front_glass_offset_m: 0.035 # visual estimate, ahead of projection centre
  lamp_heatsink_width_m: 0.08 # user confirmed 80 x 80 mm; height estimated
  lamp_length_m: 0.020       # user confirmed 20 x 20 mm COB emitting patch
  lamp_width_m: 0.020
  lamp_wall_footprint_m: [1.2, 0.12]
  lamp_offset_axial_m: -0.115 # light / camera / slip ring along the common x shaft
  lamp_offset_tangential_m: 0.0
  lamp_offset_radial_m: 0.0   # effective optical exit plane, parallel to camera
preview:
  ambient_rgb: [0.6, 0.6, 0.6] # readable GUI surroundings; independent of OptiX photometry
  work_lights_enabled: true    # left/right front/rear diagonal wide spots with shadows
  work_light_down_deg: 15.0
  work_light_side_deg: 15.0
  work_light_inner_deg: 80.0   # full bright cone angle, not half-angle
  work_light_outer_deg: 90.0   # full support cone angle
  work_light_range_m: 8.0
  indirect_fill_relative: 0.002 # effective weak reflected irradiance / nominal strip; uncalibrated
  strip_light_enabled: true    # 17 shadowed GUI spots; OptiX remains the imager
materials:
  sources: [plastered_wall_04, Concrete030, plastered_wall_03]
  # Concrete030 has no verified physical coverage size: explicit initial assumption.
  source_width_m: {plastered_wall_04: 3.2, Concrete030: 2.0, plastered_wall_03: 4.0}
  reference: plastered_wall_04
  brightness_factors: [1.0, 0.8, 0.65]
  min_repeat_distance_x_m: 5.0
  tile_core_pixels: 1024
  tile_gutter_pixels: 4
  background_texel_m: 0.0002
  gui_preview_texel_m: 0.002 # per-panel preview from actual baked albedo
cracks:
  width_min_mm: 0.2
  width_max_mm: 0.6
  width_mean_mm: 0.4
  width_std_mm: 0.1
  types: [longitudinal, transverse, diagonal, curved, branching, network]
  # Initial appearance mix, not a measured tunnel defect prevalence.
  # Count each connected network as one instance; its branches are not extra instances.
  composition_weights: {long_slender: 0.80, short_slender: 0.15, network: 0.05}
  branch_probability_in_slender: 0.08  # provisional small subset inside BOTH slender classes
  required_long_crack_length_m: 10.0
  # Length/density/depth selected after candidate review, not inferred from source PNG.
  # Path/width refinement (B2, synthetic detail): the source skeleton has ~4.8 mm pixels, so
  # shape below smooth_m is replaced by self-affine wiggle; widths vary along the crack.
  refine:
    resample_m: 0.0005
    smooth_m: 0.005                 # Gaussian sigma removing the source pixel staircase
    wiggle: {min_wavelength_m: 0.0005, max_wavelength_m: 0.02, amplitude_m: 0.0005, reference_wavelength_m: 0.01, hurst: 0.75}
    junction_taper_m: 0.01          # wiggle fades to zero at shared (branch) endpoints
    width_log_sigma: [0.18, 0.08]   # slow (5-20 mm) and fine (1-2 mm) width variation
  # Effective visible depth for the crack cavity appearance (stage_b_defects --depth; synthetic,
  # not a measured/total depth): D = aspect x local width, aspect log-normal along the crack;
  # short shallow stretches stand for debris/dust. Interior reflectance of a slot with opening
  # fraction w/(w+2D): median aspect 0.9 gives ~0.45 of the wall albedo at the crack centre.
  depth:
    scale: 0.8                    # 20% shallower effective depth; preserves along-path variation
    aspect_median: 0.9
    aspect_log_sigma: 0.5
    wavelengths_m: [0.005, 0.04]
    plug_rate_per_m: 6
    plug_length_m: [0.003, 0.015]
    plug_aspect: 0.15
    max_depth_m: 0.01
resources:
  # Hard limits for preparation stages which implement the relevant allocation.
  asset_working_set_bytes: 536870912
  max_download_bytes: 2147483648
  # Precision takes priority; independent bounded GPU and CPU texture caches.
  gpu_texture_budget_bytes: 2147483648
  cpu_texture_cache_bytes: 1073741824
  gpu_preview_texture_budget_bytes: 1342177280 # separate GUI RGBA8 + mip allowance; current estimate 746 MiB
  max_mesh_triangles: 800000      # rounded, wiggled joint lips
  max_scene_vertices: 1600000
  overview_max_side: 2048
